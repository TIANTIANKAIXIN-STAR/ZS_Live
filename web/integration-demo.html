<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZS Live - 嵌入集成 Demo</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --ok:#3fb950; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; } header .hint { color:var(--muted); font-size:12px; }
  header a { color:var(--accent); font-size:12px; text-decoration:none; margin-left:auto; }
  .toolbar { display:flex; gap:10px; align-items:center; padding:14px 24px; flex-wrap:wrap; }
  .toolbar select, .toolbar input { background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 10px; font-size:13px; }
  .toolbar button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px;
    font-size:13px; cursor:pointer; }
  .toolbar button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .panes { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:0 24px; }
  .pane { background:#000; border:1px solid var(--border); border-radius:10px; overflow:hidden; height:380px; position:relative; }
  .pane .tag { position:absolute; top:8px; left:8px; z-index:5; background:rgba(22,27,34,.85); border:1px solid var(--border);
    border-radius:6px; font-size:11px; padding:3px 8px; color:var(--muted); pointer-events:none; }
  .pane .ops { position:absolute; top:8px; right:8px; z-index:5; display:flex; gap:6px; }
  .pane .ops button { background:rgba(22,27,34,.85); color:var(--text); border:1px solid var(--border);
    border-radius:6px; font-size:11px; padding:4px 10px; cursor:pointer; }
  #log { margin:14px 24px 30px; background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; height:180px; overflow:auto; font-family:Consolas,monospace; font-size:12px; line-height:1.8; }
  #log .e { color:#f85149; } #log .s { color:var(--ok); } #log .m { color:var(--muted); }
  @media (max-width: 900px) { .panes { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>ZS Live 嵌入集成 Demo</h1>
  <span class="hint">演示 zslive-parent.js 父页面 SDK：同页多路 streamId、gameAPI 风格指令、事件回调</span>
  <a href="/">← 返回程序列表</a>
</header>

<div class="toolbar">
  <label class="hint">模板</label>
  <select id="tpl"></select>
  <button id="btnMount2">挂载两路（多路演示）</button>
  <button class="ghost" id="btnDestroy">全部销毁</button>
  <button class="ghost" id="btnCmd">发送 camera.config 指令</button>
  <button class="ghost" id="btnRaw">发送 sendRaw 指令</button>
</div>

<div class="panes">
  <div class="pane" id="paneA"><span class="tag">streamId: view-a</span>
    <div class="ops"><button onclick="focusStream('view-a')">聚焦</button><button onclick="dropStream('view-a')">断开</button></div></div>
  <div class="pane" id="paneB"><span class="tag">streamId: view-b</span>
    <div class="ops"><button onclick="focusStream('view-b')">聚焦</button><button onclick="dropStream('view-b')">断开</button></div></div>
</div>

<div id="log"></div>

<script src="/sdk/zslive-parent.js"></script>
<script>
'use strict';
const hub = new ZsLiveHub();
const logEl = document.getElementById('log');

function log(cls, text) {
  const t = new Date().toLocaleTimeString();
  logEl.innerHTML += `<div class="${cls}">[${t}] ${text}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function bindEvents(stream, sid) {
  stream.on('ready', () => log('m', `[${sid}] 控制通道已连接`));
  stream.on('assigned', (d) => log('m', `[${sid}] 实例已分配: ${d && d.instanceId || ''}`));
  stream.on('streaming', () => log('s', `[${sid}] 视频推流已开始`));
  stream.on('inputready', () => log('s', `[${sid}] 数据通道就绪（可发指令）`));
  stream.on('platform', (d) => log('m', `[${sid}] platform ${d.code} ${d.message}`));
  stream.on('error', (d) => log('e', `[${sid}] 错误 ${d && d.code || ''}: ${d && d.message || ''}`));
  stream.on('ue', (d) => log('m', `[${sid}] UE 事件: ${d && d.name} ${JSON.stringify(d && d.data)}`));
  stream.on('disconnected', (d) => log('e', `[${sid}] 已断开: ${d && d.reason || ''}`));
}

function mountInto(paneId, streamId) {
  const tpl = document.getElementById('tpl').value;
  if (hub.has(streamId)) { log('m', `[${streamId}] 已存在，跳过`); return; }
  const stream = hub.mount({
    container: '#' + paneId,
    template: tpl,
    streamId,
    // baseUrl 不传 = 同源
  });
  bindEvents(stream, streamId);
  log('m', `[${streamId}] 已挂载（template=${tpl || '默认'}）`);
}

document.getElementById('btnMount2').onclick = () => {
  mountInto('paneA', 'view-a');
  mountInto('paneB', 'view-b');
};
document.getElementById('btnDestroy').onclick = () => { hub.destroyAll(); log('m', '已全部销毁'); };
document.getElementById('btnCmd').onclick = () => {
  const s = hub.get('view-a');
  if (s) { s.camera('config', { fov: 90, ts: Date.now() }); log('m', '[view-a] 已发送 camera.config'); }
};
document.getElementById('btnRaw').onclick = () => {
  const s = hub.get('view-a');
  if (s) { s.sendRaw(JSON.stringify({ api: 'camera', action: 'orbit', params: { speed: 1 } })); log('m', '[view-a] 已发送 sendRaw'); }
};
function focusStream(sid) { const s = hub.get(sid); if (s) s.focus(); }
function dropStream(sid) { const s = hub.get(sid); if (s) s.disconnect(); }

// 加载模板列表
fetch('/api/programs').then((r) => r.json()).then((d) => {
  const sel = document.getElementById('tpl');
  sel.innerHTML = (d.programs || []).map((p) =>
    `<option value="${p.id}">#${p.id} ${p.name}（空闲 ${p.pool.ready}）</option>`).join('');
  if (!d.programs || !d.programs.length) sel.innerHTML = '<option value="">（无模板，请先到管理后台添加）</option>';
});
</script>
</body>
</html>
